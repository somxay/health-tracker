<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ຄົນແພ້ກໍຕ້ອງດູແລຕົວເອງ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; background: #080a12; }
    body { font-family: 'Noto Sans Lao', -apple-system, sans-serif; }
    #loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; color: #6b7280; font-size: 14px; gap: 12px;
    }
    .spin { display: inline-block; animation: spin 1s linear infinite; font-size: 28px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #root { min-height: 100vh; }
  </style>
</head>
<body>

<div id="loading">
  <span class="spin">🐱</span>
  <span>ກຳລັງໂຫຼດ...</span>
</div>
<div id="root" style="display:none"></div>

<script>
// ── Step 1: Load scripts in order, then mount app ──────────────────────────
const SCRIPTS = [
  // React 18 (must be first)
  "https://unpkg.com/react@18.3.1/umd/react.production.min.js",
  // ReactDOM 18
  "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js",
  // prop-types (Recharts depends on this)
  "https://unpkg.com/prop-types@15.8.1/prop-types.min.js",
  // Recharts 2.x (needs React + prop-types loaded first)
  "https://unpkg.com/recharts@2.12.7/umd/Recharts.js",
  // Babel standalone (to parse JSX)
  "https://unpkg.com/@babel/standalone@7.24.4/babel.min.js",
];

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed: ' + src));
    document.head.appendChild(s);
  });
}

async function loadApp() {
  try {
    // Load all dependencies in sequence (order matters!)
    for (const src of SCRIPTS) {
      await loadScript(src);
    }

    // Verify Recharts loaded correctly
    if (typeof Recharts === 'undefined') {
      throw new Error('Recharts failed to load');
    }
    if (typeof React === 'undefined') {
      throw new Error('React failed to load');
    }

    // Now load app.jsx via Babel
    const res = await fetch('app.jsx?v=' + Date.now());
    const code = await res.text();
    const transformed = Babel.transform(code, {
      presets: ['react'],
      filename: 'app.jsx',
    }).code;

    // Execute the transformed code
    const fn = new Function(transformed);
    fn();

    // Show app, hide loader
    document.getElementById('loading').style.display = 'none';
    document.getElementById('root').style.display = 'block';

  } catch (err) {
    console.error('Load error:', err);
    document.getElementById('loading').innerHTML =
      '<span style="font-size:32px">😿</span>' +
      '<span style="color:#ef4444;font-size:13px">ໂຫຼດບໍ່ສຳເລັດ: ' + err.message + '</span>' +
      '<span style="color:#6b7280;font-size:11px">ກວດສອບ internet ແລ້ວ refresh</span>' +
      '<button onclick="location.reload()" style="padding:8px 20px;background:#6366f1;color:white;border:none;border-radius:8px;cursor:pointer;font-size:13px">🔄 Refresh</button>';
  }
}

loadApp();
</script>

</body>
</html>
